# Domain 05: neonatal / young-infant danger signs. Original summaries.
- id: young-infant-danger
  domain: neonatal
  version: 1.0.0
  priority: 1
  scope: Sick infants under 2 months with any danger sign.
  trigger_facts: [infant_under2mo]
  trigger_any_of: [poor_feeding, fever, breathing_difficulty,
    rapid_breathing, lethargy, convulsions, vomiting_persistent,
    reduced_urine, unconscious]
  required_missing_information: [age_days, preterm_or_low_birthweight,
    feeding_details, temperature_if_taken, onset]
  risk_level: emergency
  required_actions:
    - Emergency referral immediately; young infants deteriorate fast and
      need a lower threshold than older children for everything.
  prohibited_actions:
    - Home observation or delayed review.
    - Attributing fever to room temperature, clothing, or immunization
      without assessment.
    - Any medicine or dose recommendation.
  safe_interim_actions:
    - Keep warm (skin-to-skin), attempt feeding only if alert and able to
      swallow, keep nothing else by mouth if lethargic.
  uncertainty_notes: >
    Serious bacterial infection cannot be excluded by chat in this age
    group; examination and labs are required.
  source:
    authority: WHO
    title: "Integrated Management of Childhood Illness: Chart Booklet"
    canonical_url: https://www.who.int/publications/m/item/integrated-management-of-childhood-illness---chart-booklet-(march-2014)
    publication_date: "2014-03-04"
    version: March 2014 (ISBN 9789241506823)
    section_page: young infant (under 2 months) assessment
    license: Copyright WHO 2014 (all rights reserved); original summary only
  review: {machine_verified: true, clinician_reviewed: false,
    last_reviewed: "2026-09-20"}

- id: neonatal-jaundice
  domain: neonatal
  version: 1.0.0
  priority: 2
  scope: Jaundiced newborns.
  trigger_facts: [neonate, jaundice]
  trigger_any_of: []
  required_missing_information: [age_hours_days, onset_timing,
    feeding_and_alertness, stool_and_urine_color, preterm]
  risk_level: urgent
  required_actions:
    - Same-day assessment; jaundice in the first day of life, or with poor
      feeding/lethargy, is an emergency.
  prohibited_actions:
    - Sunlight-only treatment plans without assessment.
    - Reassurance that all newborn jaundice is physiological.
  safe_interim_actions:
    - Frequent effective feeding while arranging review; note spread of
      yellowing and behavior changes.
  uncertainty_notes: >
    Pathological vs physiological jaundice needs age-in-hours assessment
    and often bilirubin testing.
  source:
    authority: WHO
    title: "Integrated Management of Childhood Illness: Chart Booklet"
    canonical_url: https://www.who.int/publications/m/item/integrated-management-of-childhood-illness---chart-booklet-(march-2014)
    publication_date: "2014-03-04"
    version: March 2014 (ISBN 9789241506823)
    section_page: young infant assessment (jaundice)
    license: Copyright WHO 2014 (all rights reserved); original summary only
  review: {machine_verified: true, clinician_reviewed: false,
    last_reviewed: "2026-09-20"}
