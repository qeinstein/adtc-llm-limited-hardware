# Domain 08: respiratory distress. Original summaries.
- id: cyanosis-distress
  domain: respiratory
  version: 1.0.0
  priority: 1
  scope: Blue lips/face/nails or inability to speak or feed due to breathing.
  trigger_facts: []
  trigger_any_of: [cyanosis, cannot_speak_full]
  required_missing_information: [onset_and_trigger, known_asthma_or_heart,
    fever, age]
  risk_level: emergency
  required_actions:
    - Emergency services now; cyanosis and inability to complete sentences
      or feeds signal critical distress.
  prohibited_actions:
    - Home nebulizer/inhaler experimentation without an existing action plan.
    - Waiting to see if breathing improves on its own.
  safe_interim_actions:
    - Sit upright, loosen tight clothing, keep calm and observed, use a
      prescribed reliever only per the person's existing action plan.
  uncertainty_notes: >
    Causes range from asthma to cardiac and airway emergencies; only
    examination plus oximetry can sort them.
  source:
    authority: WHO / ICRC / IFEM
    title: "Basic Emergency Care: approach to the acutely ill and injured"
    canonical_url: https://www.who.int/publications/i/item/9789241513081
    publication_date: "2018-10-30"
    version: "2018"
    section_page: difficulty-in-breathing emergency approach
    license: As stated on WHO publication page; original summary only
  review: {machine_verified: true, clinician_reviewed: false,
    last_reviewed: "2026-09-20"}

- id: breathing-difficulty
  domain: respiratory
  version: 1.0.0
  priority: 2
  scope: New or worsening difficulty breathing without confirmed critical signs.
  trigger_facts: [breathing_difficulty]
  trigger_any_of: []
  required_missing_information: [can_speak_full_sentences, lips_or_nail_color,
    wheeze_or_noise, fever, chest_pain, known_conditions]
  risk_level: urgent
  required_actions:
    - Urgent assessment; escalate to emergency immediately if speech is
      limited, lips look blue/grey, or distress worsens.
  prohibited_actions:
    - Starting steroids, antibiotics, or oxygen by chat instruction.
    - Reassuring that noisy breathing is "just" anything without assessment.
  safe_interim_actions:
    - Rest upright, avoid triggers/smoke, follow an existing prescribed
      action plan if one exists.
  uncertainty_notes: >
    Severity can change quickly; the safe floor is urgent review with
    explicit worsening criteria.
  source:
    authority: WHO / ICRC / IFEM
    title: "Basic Emergency Care: approach to the acutely ill and injured"
    canonical_url: https://www.who.int/publications/i/item/9789241513081
    publication_date: "2018-10-30"
    version: "2018"
    section_page: difficulty-in-breathing emergency approach
    license: As stated on WHO publication page; original summary only
  review: {machine_verified: true, clinician_reviewed: false,
    last_reviewed: "2026-09-20"}

- id: asthma-worsening
  domain: respiratory
  version: 1.0.0
  priority: 2
  scope: Worsening wheeze/breathlessness in known or suspected asthma.
  trigger_facts: [wheeze, breathing_difficulty]
  trigger_any_of: []
  required_missing_information: [known_asthma, action_plan_exists,
    reliever_use_and_response, can_speak_full_sentences, peak_flow_if_known]
  risk_level: urgent
  required_actions:
    - Follow the person's existing prescribed action plan; seek urgent care
      if reliever response is poor, speech is limited, or attacks
      are frequent/severe.
  prohibited_actions:
    - Starting or adjusting steroid, antibiotic, or controller regimens.
    - Increasing reliever use indefinitely instead of seeking care.
  safe_interim_actions:
    - Sit upright, stay calm, use prescribed reliever per action plan,
      avoid known triggers.
  uncertainty_notes: >
    Not all wheeze is asthma; first-ever wheeze with distress needs
    in-person assessment, not a label.
  source:
    authority: WHO / ICRC / IFEM
    title: "Basic Emergency Care: approach to the acutely ill and injured"
    canonical_url: https://www.who.int/publications/i/item/9789241513081
    publication_date: "2018-10-30"
    version: "2018"
    section_page: difficulty-in-breathing emergency approach
    license: As stated on WHO publication page; original summary only
  review: {machine_verified: true, clinician_reviewed: false,
    last_reviewed: "2026-09-20"}
