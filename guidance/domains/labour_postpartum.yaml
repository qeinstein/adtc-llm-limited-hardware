# Domain 04: labour / postpartum emergencies. Original summaries; see manifest.
- id: pp-bleeding
  domain: labour_postpartum
  version: 1.0.0
  priority: 1
  scope: Heavy vaginal bleeding after birth.
  trigger_facts: [postpartum, bleeding_severe]
  trigger_any_of: []
  required_missing_information: [time_since_birth, amount_and_clots,
    dizziness_or_faint, placenta_delivered, place_of_birth]
  risk_level: emergency
  required_actions:
    - Emergency care immediately; heavy postpartum bleeding can kill quickly.
    - Track pad count and time; keep the woman lying flat and warm.
  prohibited_actions:
    - Vaginal examinations or manual procedures by chat instruction.
    - Uterotonic or any other drug dosing.
    - Reassurance that bleeding "looks normal" without assessment.
  safe_interim_actions:
    - Nothing inserted vaginally; massage instructions only if a trained
      attendant is present; arrange immediate transport.
  uncertainty_notes: >
    Cause and management need hands-on obstetric assessment; chat sets the
    floor at immediate referral.
  source:
    authority: WHO / ICRC / IFEM
    title: "Basic Emergency Care: approach to the acutely ill and injured"
    canonical_url: https://www.who.int/publications/i/item/9789241513081
    publication_date: "2018-10-30"
    version: "2018"
    section_page: bleeding and shock (circulation) emergency approach
    license: As stated on WHO publication page; original summary only
  review: {machine_verified: true, clinician_reviewed: false,
    last_reviewed: "2026-09-20"}

- id: pp-fever
  domain: labour_postpartum
  version: 1.0.0
  priority: 2
  scope: Fever after birth (possible postpartum infection).
  trigger_facts: [postpartum, fever]
  trigger_any_of: []
  required_missing_information: [days_since_birth, foul_discharge,
    abdominal_pain, breastfeeding_or_breast_pain, rigor]
  risk_level: urgent
  required_actions:
    - Same-day assessment; postpartum infection can worsen fast.
  prohibited_actions:
    - Recommending or dosing antibiotics.
    - Attributing fever to milk/breastfeeding without assessment.
  safe_interim_actions:
    - Fluids and rest; note discharge odor, pain, and temperature trend for
      the clinician.
  uncertainty_notes: >
    Source of postpartum fever needs examination and often labs; chat
    cannot distinguish causes.
  source:
    authority: WHO / ICRC / IFEM
    title: "Basic Emergency Care: approach to the acutely ill and injured"
    canonical_url: https://www.who.int/publications/i/item/9789241513081
    publication_date: "2018-10-30"
    version: "2018"
    section_page: fever/altered-status emergency approach
    license: As stated on WHO publication page; original summary only
  review: {machine_verified: true, clinician_reviewed: false,
    last_reviewed: "2026-09-20"}
