# Domain 15: medication safety. Product-policy cards (no invented dosing).
- id: dosing-variables
  domain: medication
  version: 1.0.0
  priority: 2
  scope: Any request for an individualized medicine dose.
  trigger_facts: [dosing_request]
  trigger_any_of: []
  required_missing_information: [age, weight, indication,
    formulation_and_strength, pregnancy_or_breastfeeding, allergies,
    kidney_or_liver_disease, other_medicines]
  risk_level: routine
  required_actions:
    - Collect the dose-determining variables before giving any numbers.
    - Give non-individualized general information (what the drug is for,
      why dosing is individualized, label/pharmacist guidance) until complete.
    - Pediatric, pregnancy, kidney/liver, and narrow-window cases get
      referral plus a lower threshold for refusing to guess.
  prohibited_actions:
    - Personalized doses with missing variables.
    - Pediatric or pregnancy dosing without full variables and referral.
    - Presenting a guessed dose as guideline-based.
  safe_interim_actions:
    - Explain which facts the dose depends on and ask for them; point to
      package label, prescriber, or pharmacist for the final number.
  uncertainty_notes: >
    Correct dosing is patient-specific; chat collects variables and
    informs, the prescription comes from the care team.
  source:
    authority: Jamii Afya
    title: Jamii Afya product safety policy v1
    canonical_url: SAFETY.md (this repository)
    publication_date: "2026-09-20"
    version: 1.0.0
    section_page: medication/dosage safeguard
    license: Same as repository (product safety policy, not clinical guidance)
  review: {machine_verified: true, clinician_reviewed: false,
    last_reviewed: "2026-09-20"}

- id: high-risk-meds
  domain: medication
  version: 1.0.0
  priority: 1
  scope: Blood thinners, insulin, opioids, seizure/heart medicines, chemo, and similar.
  trigger_facts: [high_risk_med]
  trigger_any_of: []
  required_missing_information: [full_medicine_list, indication,
    prescriber_awareness, kidney_or_liver_disease, pregnancy, allergies]
  risk_level: urgent
  required_actions:
    - Require pharmacist/clinician review; prompt an interaction check
      against the full medicine list.
  prohibited_actions:
    - Starting, stopping, or adjusting these medicines by chat.
    - Dismissing interaction or bleeding/hypoglycemia risks.
    - Recommending dose changes for missed or doubled doses without
      directing to prescriber/pharmacist wording.
  safe_interim_actions:
    - Explain the specific risk class in general terms and what information
      the clinician/pharmacist will need.
  uncertainty_notes: >
    Interaction and bleeding/hypoglycemia risk is patient-specific; chat
    flags the class and routes to humans.
  source:
    authority: Jamii Afya
    title: Jamii Afya product safety policy v1
    canonical_url: SAFETY.md (this repository)
    publication_date: "2026-09-20"
    version: 1.0.0
    section_page: medication/dosage safeguard
    license: Same as repository (product safety policy, not clinical guidance)
  review: {machine_verified: true, clinician_reviewed: false,
    last_reviewed: "2026-09-20"}
