# Domain 07: poisoning / caustic ingestion. Original summaries.
- id: caustic-bleach
  domain: poisoning
  version: 1.0.0
  priority: 1
  scope: Ingestion of bleach, acids, alkalis, or other caustics.
  trigger_facts: [caustic_ingestion]
  trigger_any_of: []
  required_missing_information: [product_name, amount, time_since,
    age_and_weight, symptoms_so_far]
  risk_level: emergency
  required_actions:
    - Emergency care plus poison-centre contact immediately, even if the
      person feels fine; caustic injury can be delayed.
    - Keep the container/label for clinicians.
  prohibited_actions:
    - Suggesting drinking bleach for any purpose, ever.
    - Inventing dilution ratios, "flush" protocols, or neutralizers.
    - Inducing vomiting.
    - Attributing any bleach recipe to WHO/IMCI (fabrication).
  safe_interim_actions:
    - Small sips of water/milk only if the person is alert, can swallow,
      and poison-centre guidance is being followed; otherwise nothing by
      mouth and rapid transfer.
  uncertainty_notes: >
    Injury severity needs endoscopy-era assessment; absence of early pain
    does not exclude serious burns.
  source:
    authority: WHO / ICRC / IFEM
    title: "Basic Emergency Care: approach to the acutely ill and injured"
    canonical_url: https://www.who.int/publications/i/item/9789241513081
    publication_date: "2018-10-30"
    version: "2018"
    section_page: poisoning emergency approach (airway, breathing, circulation first)
    license: As stated on WHO publication page; original summary only
  review: {machine_verified: true, clinician_reviewed: false,
    last_reviewed: "2026-09-20"}

- id: poisoning-general
  domain: poisoning
  version: 1.0.0
  priority: 1
  scope: Known or suspected poisoning (medicines, chemicals, plants, unknown).
  trigger_facts: [poison_ingestion]
  trigger_any_of: []
  required_missing_information: [substance, dose_or_amount, time_since,
    age_and_weight, symptoms_so_far]
  risk_level: emergency
  required_actions:
    - Identify substance, amount, and time; contact poison centre and
      emergency services; bring the container.
    - Unknown substances and symptomatic cases are emergencies by default.
  prohibited_actions:
    - Inducing vomiting unless the poison centre specifically says so.
    - Home remedies (milk, oil, salt water) presented as treatment.
    - Watchful waiting for unknown or potentially toxic ingestions.
  safe_interim_actions:
    - Keep the person safe and observed; recovery position if drowsy;
      save vomitus/container details for clinicians if available.
  uncertainty_notes: >
    Toxicity depends on substance, dose, weight, and time; only the poison
    centre plus examination can risk-stratify.
  source:
    authority: WHO / ICRC / IFEM
    title: "Basic Emergency Care: approach to the acutely ill and injured"
    canonical_url: https://www.who.int/publications/i/item/9789241513081
    publication_date: "2018-10-30"
    version: "2018"
    section_page: poisoning emergency approach
    license: As stated on WHO publication page; original summary only
  review: {machine_verified: true, clinician_reviewed: false,
    last_reviewed: "2026-09-20"}
