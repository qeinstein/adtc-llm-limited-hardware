# Domain 16: mental health / self-harm. Original summaries.
- id: self-harm
  domain: mental_health
  version: 1.0.0
  priority: 1
  scope: Suicidal intent, plan, means, or recent attempt; inability to stay safe.
  trigger_facts: [suicidal_intent]
  trigger_any_of: []
  required_missing_information: [immediacy, plan_or_means, alone_or_supported,
    recent_attempt, location_support]
  risk_level: emergency
  required_actions:
    - >-
      Direct to immediate human help now (emergency services or a trusted
      person staying with them); do not leave alone.
    - Supportive, non-judgmental language throughout.
  prohibited_actions:
    - Judgmental or minimizing language.
    - Counseling as a substitute for urgent human help.
    - Asking them to promise safety instead of connecting to help.
  safe_interim_actions:
    - Stay with a trusted person, go to a safe place, reduce access to
      means where safely possible, keep emergency numbers at hand.
  uncertainty_notes: >
    Risk fluctuates; chat cannot assess it reliably, so the floor is
    immediate human contact, not remote counseling.
  source:
    authority: Jamii Afya
    title: Jamii Afya product safety policy v1
    canonical_url: SAFETY.md (this repository)
    publication_date: "2026-09-20"
    version: 1.0.0
    section_page: self-harm escalation policy
    license: Same as repository (product safety policy, not clinical guidance)
  review: {machine_verified: true, clinician_reviewed: false,
    last_reviewed: "2026-09-20"}
