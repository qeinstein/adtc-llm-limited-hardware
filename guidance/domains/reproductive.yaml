# Domain 17: sexual / reproductive health. Original summaries.
- id: sti-info
  domain: reproductive
  version: 1.0.0
  priority: 3
  scope: STI concerns, symptoms, or exposure questions.
  trigger_facts: [sti_concern]
  trigger_any_of: []
  required_missing_information: [symptoms, exposures_and_timing,
    pregnancy, test_status]
  risk_level: routine
  required_actions:
    - Give general information plus testing/treatment via a clinician;
      encourage partner notification and condom use in general terms.
  prohibited_actions:
    - Naming antibiotic regimens or doses.
    - Diagnosing a specific STI from symptoms alone.
    - Stigmatizing or judgmental language.
  safe_interim_actions:
    - Explain what testing involves and what information helps the
      clinician; abstain pending review per general guidance.
  uncertainty_notes: >
    STI syndromes overlap heavily; testing decides treatment, not chat.
  source:
    authority: Jamii Afya
    title: Jamii Afya product safety policy v1
    canonical_url: SAFETY.md (this repository)
    publication_date: "2026-09-20"
    version: 1.0.0
    section_page: information-vs-treatment boundary
    license: Same as repository (product safety policy, not clinical guidance)
  review: {machine_verified: true, clinician_reviewed: false,
    last_reviewed: "2026-09-20"}

- id: assault-support
  domain: reproductive
  version: 1.0.0
  priority: 1
  scope: Sexual assault; survivor needs safety and time-sensitive care.
  trigger_facts: [sexual_assault]
  trigger_any_of: []
  required_missing_information: [safety_now, when_occurred, injuries,
    location_support]
  risk_level: urgent
  required_actions:
    - Safety first; urgent medical care promptly (some preventive care is
      time-sensitive); preserve the survivor's choice and control.
    - Supportive, believing, non-judgmental language.
  prohibited_actions:
    - Detailed forensic/procedural instructions beyond seeking prompt care.
    - Questioning the account or assigning blame.
    - Unsafe procedural or "home-exam" instructions of any kind.
  safe_interim_actions:
    - Go somewhere safe with support; seek care as soon as possible;
      avoid washing/changing only if able and willing pending advice at care.
  uncertainty_notes: >
    Needs are medical, psychological, and legal; chat supports and routes,
    humans provide care.
  source:
    authority: Jamii Afya
    title: Jamii Afya product safety policy v1
    canonical_url: SAFETY.md (this repository)
    publication_date: "2026-09-20"
    version: 1.0.0
    section_page: assault support and escalation
    license: Same as repository (product safety policy, not clinical guidance)
  review: {machine_verified: true, clinician_reviewed: false,
    last_reviewed: "2026-09-20"}
