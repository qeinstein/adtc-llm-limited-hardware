# Domain 14: diabetes / glucose emergencies. Original summaries.
- id: glucose-emergency
  domain: diabetes
  version: 1.0.0
  priority: 1
  scope: Abnormal consciousness or collapse in a person with diabetes.
  trigger_facts: [diabetes]
  trigger_any_of: [unconscious, altered_consciousness, lethargy, convulsions]
  required_missing_information: [consciousness_level, last_meal_and_insulin,
    glucose_reading_if_known, fever_or_illness, breathing_pattern]
  risk_level: emergency
  required_actions:
    - Emergency care now; abnormal consciousness with diabetes cannot be
      managed by chat.
  prohibited_actions:
    - Giving food or drink to a drowsy or unconscious person.
    - Insulin or other glucose-medicine dosing advice.
    - Guessing the glucose value or the cause from chat.
  safe_interim_actions:
    - If fully awake with a known hypoglycemia plan, fast sugar per that
      plan only; otherwise recovery position and rapid transfer.
  uncertainty_notes: >
    Low and high glucose (and unrelated causes) can look alike; only a
    reading plus examination sorts them.
  source:
    authority: WHO / ICRC / IFEM
    title: "Basic Emergency Care: approach to the acutely ill and injured"
    canonical_url: https://www.who.int/publications/i/item/9789241513081
    publication_date: "2018-10-30"
    version: "2018"
    section_page: altered mental status emergency approach
    license: As stated on WHO publication page; original summary only
  review: {machine_verified: true, clinician_reviewed: false,
    last_reviewed: "2026-09-20"}
