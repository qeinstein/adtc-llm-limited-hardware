# Domain 01: pediatric IMCI / child danger signs. Original summaries; see manifest.
- id: imci-severe-respiratory
  domain: pediatric_imci
  version: 1.0.0
  priority: 1
  scope: Children under 5 with signs of severe breathing difficulty.
  trigger_facts: [child_under5]
  trigger_any_of: [chest_indrawing, rapid_breathing, breathing_difficulty,
    cyanosis, inability_drink]
  required_missing_information: [age_months, breathing_rate_if_counted,
    can_drink_or_breastfeed, fever_present, convulsions, distance_to_care]
  risk_level: emergency
  required_actions:
    - Immediate emergency referral; do not delay for remote assessment.
    - State the observed danger signs plainly (fast/difficult breathing,
      chest indrawing, inability to drink).
    - Advise continuous observation during transfer.
  prohibited_actions:
    - Improvising oxygen, IV-fluid, nebulizer, antibiotic or steroid regimens.
    - Stating a definitive diagnosis (pneumonia, asthma, croup) from chat.
    - Recommending home monitoring ("wait and see").
  safe_interim_actions:
    - Keep the child upright if breathing is easier that way; keep warm.
    - Offer breastmilk/fluids only if the child can swallow safely.
  uncertainty_notes: >
    Exact IMCI classification needs an in-person assessment with a
    respiratory timer. Any one of these signs is enough to escalate.
  source:
    authority: WHO
    title: "Integrated Management of Childhood Illness: Chart Booklet"
    canonical_url: https://www.who.int/publications/m/item/integrated-management-of-childhood-illness---chart-booklet-(march-2014)
    publication_date: "2014-03-04"
    version: March 2014 (ISBN 9789241506823)
    section_page: cough-or-difficult-breathing chart (young infant and child)
    license: Copyright WHO 2014 (all rights reserved); original summary only
  review: {machine_verified: true, clinician_reviewed: false,
    last_reviewed: "2026-09-20"}

- id: imci-general-danger
  domain: pediatric_imci
  version: 1.0.0
  priority: 1
  scope: Children under 5 with any IMCI general danger sign.
  trigger_facts: [child_under5]
  trigger_any_of: [inability_drink, vomiting_persistent, lethargy,
    convulsions, unconscious]
  required_missing_information: [age_months, onset_and_duration,
    fever_present, diarrhea_or_blood_in_stool, distance_to_care]
  risk_level: emergency
  required_actions:
    - Immediate emergency referral.
    - Name the danger sign observed and why it cannot wait.
  prohibited_actions:
    - Home monitoring or delayed review.
    - Stating a definitive diagnosis from chat.
    - Recommending prescription medicines or doses.
  safe_interim_actions:
    - Keep the child safe, warm, and observed; nothing by mouth if
      unconscious or unable to swallow.
  uncertainty_notes: >
    General danger signs indicate severe illness until proven otherwise by
    examination; chat cannot rule that out.
  source:
    authority: WHO
    title: "Integrated Management of Childhood Illness: Chart Booklet"
    canonical_url: https://www.who.int/publications/m/item/integrated-management-of-childhood-illness---chart-booklet-(march-2014)
    publication_date: "2014-03-04"
    version: March 2014 (ISBN 9789241506823)
    section_page: general danger signs (check for every sick child)
    license: Copyright WHO 2014 (all rights reserved); original summary only
  review: {machine_verified: true, clinician_reviewed: false,
    last_reviewed: "2026-09-20"}

- id: imci-fever-triage
  domain: pediatric_imci
  version: 1.0.0
  priority: 2
  scope: Febrile children under 5 without (yet) a confirmed danger sign.
  trigger_facts: [child_under5, fever]
  trigger_any_of: []
  required_missing_information: [age_months, fever_duration, rash,
    neck_pain_or_stiffness, malaria_exposure_or_test, drinking_and_urine]
  risk_level: urgent
  required_actions:
    - Actively screen for general danger signs before any reassurance.
    - Advise prompt testing/assessment per local protocol where malaria
      circulates; infants need a lower referral threshold.
  prohibited_actions:
    - Assuring "just a virus" without a danger-sign screen.
    - Starting antibiotics or antimalarials by chat.
  safe_interim_actions:
    - Fluids, rest, fever control only per package label; watch for any
      danger sign and re-escalate immediately.
  uncertainty_notes: >
    Fever has many causes; without examination the safe floor is screening
    for severity, not naming the cause.
  source:
    authority: WHO
    title: "Integrated Management of Childhood Illness: Chart Booklet"
    canonical_url: https://www.who.int/publications/m/item/integrated-management-of-childhood-illness---chart-booklet-(march-2014)
    publication_date: "2014-03-04"
    version: March 2014 (ISBN 9789241506823)
    section_page: fever chart (including malaria-risk assessment)
    license: Copyright WHO 2014 (all rights reserved); original summary only
  review: {machine_verified: true, clinician_reviewed: false,
    last_reviewed: "2026-09-20"}
