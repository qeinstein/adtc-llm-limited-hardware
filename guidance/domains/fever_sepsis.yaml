# Domain 10: fever / sepsis / serious infection. Original summaries.
- id: sepsis-flags
  domain: fever_sepsis
  version: 1.0.0
  priority: 1
  scope: Fever with altered consciousness, shock signs, or inability to function.
  trigger_facts: [fever]
  trigger_any_of: [altered_consciousness, shock_signs, lethargy,
    inability_drink, breathing_difficulty, unconscious]
  required_missing_information: [duration, rash, neck_pain, urine_output,
    recent_illness_or_procedure, vulnerable_group]
  risk_level: emergency
  required_actions:
    - Emergency assessment now; fever plus confusion, faintness, mottled
      skin, no urine, or inability to drink suggests serious infection.
  prohibited_actions:
    - Attributing to malaria/flu/typhoid without assessment or testing.
    - Antipyretic-only plans for deteriorating patients.
    - Starting antibiotics by chat.
  safe_interim_actions:
    - Keep flat if faint, fluids only if alert and swallowing, note
      temperature trend and urine for clinicians.
  uncertainty_notes: >
    Sepsis recognition needs vitals and examination; chat screens for the
    pattern and escalates.
  source:
    authority: WHO / ICRC / IFEM
    title: "Basic Emergency Care: approach to the acutely ill and injured"
    canonical_url: https://www.who.int/publications/i/item/9789241513081
    publication_date: "2018-10-30"
    version: "2018"
    section_page: fever/altered mental status and shock approach
    license: As stated on WHO publication page; original summary only
  review: {machine_verified: true, clinician_reviewed: false,
    last_reviewed: "2026-09-20"}

- id: fever-persistent
  domain: fever_sepsis
  version: 1.0.0
  priority: 3
  scope: Fever without severity flags.
  trigger_facts: [fever]
  trigger_any_of: []
  required_missing_information: [duration_and_pattern, other_symptoms,
    age_and_pregnancy, malaria_exposure_or_test, urine_and_drinking]
  risk_level: routine
  required_actions:
    - Give home-care basics plus explicit red flags and when to test (e.g.,
      malaria where it circulates) and when to return urgently.
  prohibited_actions:
    - Starting antibiotics or antimalarials without assessment/testing.
    - Naming a definitive cause from fever alone.
  safe_interim_actions:
    - Fluids, rest, fever control only per package label; monitor drinking,
      urine, alertness, and breathing.
  uncertainty_notes: >
    Most fevers are self-limited, but duration, pattern, and red flags
    decide; when in doubt, test and assess.
  source:
    authority: WHO / ICRC / IFEM
    title: "Basic Emergency Care: approach to the acutely ill and injured"
    canonical_url: https://www.who.int/publications/i/item/9789241513081
    publication_date: "2018-10-30"
    version: "2018"
    section_page: fever emergency approach and red flags
    license: As stated on WHO publication page; original summary only
  review: {machine_verified: true, clinician_reviewed: false,
    last_reviewed: "2026-09-20"}
