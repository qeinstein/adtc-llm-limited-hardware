name: Official ADTC profiler (Q2K submission)

# Runs the OFFICIAL organizer-supplied profiler, unmodified, against the
# frozen Q2K artifact + patched runtime. The profiler's number is the
# authoritative submission measurement; dev numbers live separately.
# Trigger manually for the release PR/commit; MUST pass before merge.
#
# The bounded sparse runtime is env-gated: this workflow MUST export the
# frozen bounded_3gb production env (via $GITHUB_ENV) before invoking
# adtc-profiler, so the profiler's internal llama-bench child inherits it.
# Without the env, the run silently profiles the RESIDENT path (~15 GB).
# A hard preflight gate fails fast if the bounded marker is absent.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROFILER_SPEC: git+https://github.com/Africa-Deep-Tech-Foundation/adtc-profiler.git@12be4f384c18d554d99cef380979132273578c59
  FINAL_MODEL_NAME: Qwen3.6-35B-A3B-UD-Q2K-experts.gguf

jobs:
  official-profiler:
    runs-on: ubuntu-22.04
    timeout-minutes: 720
    steps:
      - name: Checkout exact submission commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record clean-checkout identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p artifacts
          {
            echo "submission_commit=$(git rev-parse HEAD)"
            echo "workflow_sha=$GITHUB_SHA"
            echo "branch=${GITHUB_REF_NAME}"
            echo "profiler_spec=$PROFILER_SPEC"
            echo "runner=$(uname -a)"
            echo "cpu=$(grep -m1 'model name' /proc/cpuinfo || true)"
            echo "cores=$(nproc)"
            echo "memory=$(free -h)"
            echo "disk=$(df -h /)"
          } > artifacts/environment.txt

      - name: Reclaim disk (model is 12.3 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h /

      - name: Validate metadata + manifest before downloading
        run: |
          set -euo pipefail
          make validate
          python3 - <<'PY'
          import json
          from pathlib import Path
          meta = json.loads(Path("metadata.json").read_text())
          assert meta["_runtime"]["model_path"] == "model/Qwen3.6-35B-A3B-UD-Q2K-experts.gguf"
          assert meta["model"]["runtime"] == "llama.cpp"
          assert len(meta["test_prompts"]) == 2
          man = json.loads(Path("model/manifest.json").read_text())
          assert man["sha256"] == "0f3698ae92f91db2eb10a3650bdb6693ff8cfaf7060cbc5f256845c700c7603b"
          assert (man["k1"], man["k2"]) == (4, 16)
          print("metadata + manifest: VALID")
          PY

      - name: Install build tools and Python
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake build-essential python3-dev

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build frozen sparse runtime (patched llama-bench on PATH)
        run: |
          bash scripts/build_runtime.sh
          test -x "$GITHUB_WORKSPACE/runtime/llama.cpp/build-native/bin/llama-bench"
          test -x "$GITHUB_WORKSPACE/runtime/llama.cpp/build-native/bin/llama-server"
          echo "$GITHUB_WORKSPACE/runtime/llama.cpp/build-native/bin" >> "$GITHUB_PATH"

      - name: Install the pinned official ADTC profiler
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary llama-cpp-python
          python -m pip install "$PROFILER_SPEC"
          python - <<'PY'
          import adtc_profiler
          print("adtc-profiler import: PASS")
          PY

      - name: Download exact artifact through repository mechanism
        run: |
          set -euo pipefail
          bash download_model.sh
          test -f "model/$FINAL_MODEL_NAME"
          actual="$(sha256sum "model/$FINAL_MODEL_NAME" | awk '{print $1}')"
          expected="$(python3 -c "import json; print(json.load(open('model/manifest.json'))['sha256'])")"
          test "$actual" = "$expected"
          printf '{"filename":"%s","bytes":%s,"sha256":"%s"}\n' "$FINAL_MODEL_NAME" "$(stat -c%s "model/$FINAL_MODEL_NAME")" "$actual" | tee artifacts/sha256-manifest.json

      - name: Export frozen bounded_3gb production env + pins
        run: |
          set -euo pipefail
          PINS_FILE="$(python3 - <<'PY'
          import os
          import sys
          from src.sparse import build_env, export_pins
          pins = export_pins("3.0")  # asserts 80 pins from cache_config_k4.json
          assert pins.is_absolute(), pins
          env = build_env("bounded_3gb", str(pins))
          # Production-point assertions; single source is configs/final_runtime.json.
          assert env["GGML_MOE_K1"] == "4", env
          assert env["GGML_MOE_K2"] == "16", env
          assert env["GGML_PHASE6_BOUNDED_CACHE"] == "1", env
          assert env["GGML_PHASE6_SLOTS"] == "755", env
          assert env["GGML_PHASE6_ASYNC"] == "1", env
          assert env["LLAMA_ARG_LAZY_MODE"] == "on", env
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              for k, v in env.items():
                  fh.write(f"{k}={v}\n")
          print("exported:", " ".join(f"{k}={v}" for k, v in env.items()),
                file=sys.stderr)
          print(str(pins))  # stdout: path for the shell below
          PY
          )"
          test "$(wc -l < "$PINS_FILE")" = "80"

      - name: Preflight bounded-runtime gate (fail fast, no 20-min burn)
        run: |
          set -euo pipefail
          test "${GGML_MOE_K1:?missing GGML_MOE_K1}" = "4"
          test "${GGML_MOE_K2:?missing GGML_MOE_K2}" = "16"
          test "${GGML_PHASE6_BOUNDED_CACHE:?missing GGML_PHASE6_BOUNDED_CACHE}" = "1"
          test "${GGML_PHASE6_SLOTS:?missing GGML_PHASE6_SLOTS}" = "755"
          test "${GGML_PHASE6_ASYNC:?missing GGML_PHASE6_ASYNC}" = "1"
          test "${LLAMA_ARG_LAZY_MODE:?missing LLAMA_ARG_LAZY_MODE}" = "on"
          test -n "${GGML_PHASE6_PINS:?missing GGML_PHASE6_PINS}"
          case "$GGML_PHASE6_PINS" in /*) ;; *) echo "PINS not absolute: $GGML_PHASE6_PINS"; exit 1;; esac
          test -f "$GGML_PHASE6_PINS"
          test "$(wc -l < "$GGML_PHASE6_PINS")" = "80"
          actual="$(sha256sum "model/$FINAL_MODEL_NAME" | awk '{print $1}')"
          expected="$(python3 -c "import json; print(json.load(open('model/manifest.json'))['sha256'])")"
          test "$actual" = "$expected"
          echo "env + pins(80) + model hash: OK"
          # Tiny smoke on the SAME binary the profiler will exec; the bounded
          # runtime prints its report line (with slots/pins/requests) at exit.
          # (K1/K2 are consumed from env by the graph patch, which echoes
          # nothing, so env presence is the K1=4/K2=16 check.)
          command -v llama-bench
          test "$(command -v llama-bench)" = "$GITHUB_WORKSPACE/runtime/llama.cpp/build-native/bin/llama-bench"
          BIN="$GITHUB_WORKSPACE/runtime/llama.cpp/build-native/bin/llama-bench"
          timeout 600 "$BIN" -m "model/$FINAL_MODEL_NAME" -p 8 -n 4 -t 2 -ngl 0 \
            > artifacts/preflight-smoke.json 2> artifacts/preflight-smoke.stderr.log
          echo "--- smoke stderr tail ---"
          tail -5 artifacts/preflight-smoke.stderr.log
          grep -q "PHASE6_BOUNDED_CACHE" artifacts/preflight-smoke.stderr.log
          grep -q "slots=755" artifacts/preflight-smoke.stderr.log
          grep -q "pins=80" artifacts/preflight-smoke.stderr.log
          grep -Eq " requests=[1-9][0-9]*" artifacts/preflight-smoke.stderr.log
          if grep -q "PHASE6_BOUNDED_CACHE_ERROR" artifacts/preflight-smoke.stderr.log; then
            echo "PREFLIGHT FAIL: bounded-cache error marker present"; exit 1
          fi
          echo "PREFLIGHT: bounded_3gb runtime CONFIRMED"

      # Inherits the frozen bounded_3gb env from $GITHUB_ENV (export step
      # above); the profiler launches llama-bench as a child, which inherits it.
      - name: Run full official ADTC participant profiler (unmodified)
        run: |
          set -o pipefail
          adtc-profiler run \
            --submission "$GITHUB_WORKSPACE" \
            --mode participant \
            --output artifacts/adtc-submission.json \
            2>&1 | tee artifacts/adtc-profiler-full.log

      - name: Validate profiler report and print concise summary
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from adtc_profiler.report import validate
          report = json.loads(Path("artifacts/adtc-submission.json").read_text())
          validate(report)
          if not report.get("accuracy"):
              raise SystemExit("official full run emitted no accuracy metrics")
          peak = float((report.get("memory") or {}).get("peak_rss_mb", 1e12))
          if peak >= 7168:
              raise SystemExit(f"peak RSS is not below 7 GB: {peak} MB")
          summary = {
              "accuracy": report.get("accuracy"),
              "generation_tok_s": (report.get("throughput") or {}).get("tokens_per_second_generation"),
              "prompt_tok_s": (report.get("throughput") or {}).get("tokens_per_second_prompt"),
              "first_token_latency_ms": (report.get("throughput") or {}).get("first_token_latency_ms"),
              "peak_rss_mb": peak,
              "steady_rss_mb": (report.get("memory") or {}).get("steady_state_rss_mb"),
              "overall_score": report.get("overall_score", report.get("score")),
              "model_size": Path("model").joinpath(os.environ["FINAL_MODEL_NAME"]).stat().st_size,
              "profiler_commit": "12be4f384c18d554d99cef380979132273578c59",
              "submission_commit": os.environ.get("GITHUB_SHA"),
              "gguf_sha256": json.loads(Path("artifacts/sha256-manifest.json").read_text())["sha256"],
              "interpretation": "Official ADTC profiler software, GitHub Actions hardware self-check",
          }
          Path("artifacts/adtc-summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("## Official profiler result\n```json\n")
              fh.write(json.dumps(summary, indent=2))
              fh.write("\n```\n")
          PY

      - name: Preserve complete profiler output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-profiler-output
          path: artifacts/
          retention-days: 90
