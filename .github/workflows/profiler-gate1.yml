name: Gate-1 profiler self-check (official adtc-profiler, real submission)

# The actual pre-submission dry run: installs the REAL adtc-profiler package
# (not our own approximation) and runs it against our real hosted model via
# download_model.sh, exactly as the graders' machine would. Runs on a clean,
# disposable GitHub Actions runner rather than a long-lived RunPod pod, since
# the pod's tiny 5GB container disk has twice corrupted its own torch install
# trying to satisfy adtc-profiler's dependency tree (see PROGRESS.md) --
# GitHub Actions runners have ~14GB free and start from a clean image every run,
# so a failed/aborted pip resolution here can't damage anything we still need.

on:
  workflow_dispatch: {}

jobs:
  gate1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner hardware
        run: |
          echo "### Runner" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -m1 "model name" /proc/cpuinfo >> "$GITHUB_STEP_SUMMARY" || true
          echo "cores: $(nproc)" >> "$GITHUB_STEP_SUMMARY"
          df -h / >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Install build tools
        run: sudo apt-get update -y && sudo apt-get install -y cmake build-essential

      - name: Build SCALAR llama.cpp (audit parity)
        run: bash scripts/build_llamacpp_scalar.sh

      - name: Verify build is truly scalar
        run: |
          ./llama.cpp/build-scalar/bin/llama-cli --version 2>&1 | tee /tmp/sysinfo.txt || true
          if grep -qiE "AVX = 1|AVX2 = 1|FMA = 1" /tmp/sysinfo.txt; then
            echo "::error::Build is NOT scalar."; exit 1
          fi
          echo "Confirmed scalar (no AVX/AVX2/FMA)."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install adtc-profiler (the real package, clean environment)
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q "git+https://github.com/Africa-Deep-Tech-Foundation/adtc-profiler.git"

      - name: Download our real hosted model
        run: bash download_model.sh

      - name: Run Gate-1 (participant mode, skip accuracy -- speed/memory only)
        run: |
          export PATH="$PWD/llama.cpp/build-scalar/bin:$PATH"
          adtc-profiler run --submission "$PWD" --mode participant \
            --output "$PWD/submission.json" --skip-accuracy

      - name: Summarize result
        if: always()
        run: |
          echo "## Gate-1 profiler result" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat submission.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "submission.json not found" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload submission.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate1-submission
          path: submission.json
          if-no-files-found: warn
