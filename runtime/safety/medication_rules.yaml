# Medication high-risk patterns. A hit raises input risk to
# MEDICATION_HIGH_RISK (or keeps EMERGENCY if already raised) and requires
# the output to carry caution language + no fabricated dose.
version: 1
rules:
  - id: peds-dosing
    category: dosing
    patterns:
      - (child|baby|infant|toddler|kid|son|daughter).{0,30}(how much|dose|dosage|ml|mg|syrup|spoon)
      - (how much|dose).{0,30}(child|baby|infant|toddler|12 ?kg|\d+ ?kg).{0,10}(paracetamol|ibuprofen|syrup)
      - mtoto.{0,30}(kiasi|dozi|ml|mg|syrup)
  - id: pregnancy-meds
    category: pregnancy
    patterns:
      - (pregnant|pregnancy|breastfeed).{0,30}(safe|take|ibuprofen|medicine|drug|dose|antibiotic)
      - mjamzito.{0,30}(dawa|sawa|salama)
  - id: interaction
    category: interaction
    patterns:
      - (warfarin|blood thinner|insulin|metformin|antiretroviral|\bARV\b|HIV medicine).{0,30}(ibuprofen|herbal|together|interact|also take|with)
      - (ibuprofen|herbal|aspirin|paracetamol).{0,30}(warfarin|blood thinner|insulin|metformin|antiretroviral|\bARV\b|HIV medicine)
      - interact.{0,15}(medicine|drug|tablet)
  - id: stop-prescription
    category: adherence
    patterns:
      - (stop|quit|skip).{0,20}(blood pressure|diabetes|HIV|TB|tuberculosis|epilepsy|asthma).{0,15}(tablet|medicine|drug|medication)
      - can i stop.{0,20}(tablet|medicine|medication)
  - id: narrow-margin
    category: dosing
    patterns:
      - (warfarin|digoxin|lithium|phenytoin|theophylline).{0,25}(dose|dosage|how much|start)
      - (kidney|liver|renal|hepatic).{0,25}(dose|dosage|safe|painkiller)
  - id: antimicrobial-misuse
    category: stewardship
    patterns:
      - (cold|flu|runny nose|cough).{0,25}(amoxicillin|antibiotic|azithromycin|cipro)
      - should i take.{0,15}(amoxicillin|antibiotic)
