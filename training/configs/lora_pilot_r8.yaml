# Pilot LoRA config: r=8, ~1-2k examples, short run, evaluate immediately.
# UNEXECUTED (no training compute). Framework: TRL SFTTrainer + PEFT on
# Transformers v5, or Unsloth/MS-SWIFT Qwen3.5-MoE path with these values.
base_model: Qwen/Qwen3.6-35B-A3B
base_revision: 995ad96eacd98c81ed38be0c5b274b04031597b0
torch_dtype: bfloat16
attn_implementation: flash_attention_2

lora:
  r: 8
  alpha: 32
  dropout: 0.05
  bias: none
  # Exact substrings from model.safetensors.index.json (verified 1045 tensors).
  # Router (mlp.gate), shared_expert_gate, lm_head, embeddings EXCLUDED.
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - in_proj_qkv
    - in_proj_a
    - in_proj_b
    - in_proj_z
    - out_proj
    - gate_up_proj
    - down_proj
    - gate_proj
    - up_proj
  # Modules that must NEVER receive adapters (startup assert in train.py):
  forbidden_substrings:
    - mlp.gate
    - shared_expert_gate
    - lm_head
    - embed_tokens
    - visual
    - mtp
    - layernorm
    - conv1d

data:
  mixture: data/manifests/pilot_mixture.jsonl  # written by build_dataset.py --pilot
  max_seq_length: 2048
  assistant_only_loss: true
  packing: false

optim:
  lr: 1.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.05
  weight_decay: 0.0
  max_grad_norm: 1.0
  per_device_batch: 1
  grad_accum: 16
  epochs: 1
  gradient_checkpointing: true
  # Early stopping on held-out composite (medical + safety + general replay),
  # evaluated every N steps; patience 2 evals. Never train-loss alone.
  eval_every_steps: 50
  early_stopping_patience: 2

moe:
  # Framework-recommended auxiliary load-balance loss, default weight.
  aux_loss: framework_default
  monitor_expert_utilization: true

seeds:
  data: 7
  train: 11

logging:
  log_every: 10
  save_total_limit: 3
  output_dir: training/runs/pilot_r8
